<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../memo-common.css"></head><body>
<div class="wrap">
  <span class="kicker">図解</span>
  <h1>遮音シートが減らすのは<br><em>壁が揺れて伝わる道</em>だけ</h1>
  <p class="lead">隣の音は2つの道で届きます。すき間の道は、シートでは減りません。</p>
  <div class="fig">
    <svg viewBox="0 0 968 700" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#d4af37"/></marker>
        <marker id="aw" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e6a56a"/></marker>
      </defs>
      <!-- 見出しラベル -->
      <text x="213" y="40" text-anchor="middle" class="m b">石膏ボード</text>
      <text x="560" y="40" text-anchor="middle" class="m b">石膏ボード＋遮音シート</text>
      <!-- 部屋 -->
      <text x="95" y="290" text-anchor="middle" class="m b">隣室</text>
      <text x="820" y="290" text-anchor="middle" class="m b">自室</text>
      <!-- ボード -->
      <rect x="200" y="60" width="26" height="480" fill="#b9ab8f"/>
      <rect x="520" y="60" width="26" height="480" fill="#b9ab8f"/>
      <rect x="546" y="60" width="12" height="480" fill="#d4af37"/>
      <!-- 柱・間柱 -->
      <rect x="226" y="70" width="294" height="40" fill="#6b5640"/>
      <rect x="226" y="490" width="294" height="40" fill="#6b5640"/>
      <text x="373" y="98" text-anchor="middle" class="s" style="fill:#f4ecdc">柱・間柱</text>
      <text x="373" y="250" text-anchor="middle" class="m">空洞</text>
      <!-- コンセントボックス -->
      <rect x="226" y="330" width="62" height="60" fill="#2e241b" stroke="#c9bda6" stroke-width="3"/>
      <rect x="458" y="330" width="62" height="60" fill="#2e241b" stroke="#c9bda6" stroke-width="3"/>
      <rect x="200" y="345" width="26" height="30" fill="#241c15"/>
      <rect x="520" y="345" width="38" height="30" fill="#241c15"/>
      <text x="373" y="440" text-anchor="middle" class="s">コンセントボックス</text><text x="373" y="470" text-anchor="middle" class="s">（背中合わせ）</text>
      <!-- 道A：壁が揺れて伝わる -->
      <line x1="140" y1="180" x2="720" y2="180" stroke="#d4af37" stroke-width="6" marker-end="url(#ag)"/>
      <text x="373" y="160" text-anchor="middle" class="m g b">壁が揺れて伝わる道</text>
      <text x="590" y="228" class="s g">シートが減らすのは</text><text x="590" y="260" class="s g">この道だけ</text>
      <!-- 道B：コンセントの穴 -->
      <path d="M140,360 L720,360" stroke="#e6a56a" stroke-width="5" stroke-dasharray="14 10" fill="none" marker-end="url(#aw)"/>
      <text x="700" y="335" text-anchor="middle" class="m w b">すき間から回り込む道</text>
      <!-- 道C：巾木のすき間 -->
      <path d="M140,570 L720,570" stroke="#e6a56a" stroke-width="5" stroke-dasharray="14 10" fill="none" marker-end="url(#aw)"/>
      <text x="430" y="612" text-anchor="middle" class="m w">巾木（壁の下端）のすき間</text>
      <!-- 数値 -->
      <text x="484" y="670" text-anchor="middle" class="s">石膏ボード12.5mm 約8.5kg/m² ／ 遮音シート1.2mm 2.1kg/m²</text>
    </svg>
  </div>
  <div class="foot">
    <div>※上から見た断面の模式図。壁のつくりは建物で違います。<br>数値と出典は本文参照。</div>
    <div class="brand">防音Lab</div>
  </div>
</div></body></html>
