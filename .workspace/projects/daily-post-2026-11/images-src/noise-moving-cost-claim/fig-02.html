<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../memo-common.css"></head><body>
<div class="wrap">
  <span class="kicker">保存版メモ</span>
  <h1>今日からつける<br><em>騒音の記録表</em></h1>
  <p class="lead">判決と決定で見られていたことを、1日ずつ残す1枚。</p>
  <div class="card">
    <ul class="check">
      <li><span class="cb"></span><span class="t">日時と続いた時間<small>例：11/10 23:10〜23:40（約30分）</small></span></li>
      <li><span class="cb"></span><span class="t">音の種類<small>例：床をドンと鳴らす音</small></span></li>
      <li><span class="cb"></span><span class="t">測定値<small>機器名・置いた場所・窓を閉めたか・値</small></span></li>
      <li><span class="cb"></span><span class="t">伝えた日と返事<small>例：11/12 管理会社にメール。返事なし</small></span></li>
      <li><span class="cb"></span><span class="t">体調<small>眠れない日、通院した日</small></span></li>
      <li><span class="cb"></span><span class="t">見積書・領収書<small>引っ越しの請求額の根拠</small></span></li>
    </ul>
  </div>
  <div class="bar">音がなかった日も「なし」と書いて、記録の全体を残す。</div>
  <div class="foot">
    <div>※アプリの値は参考。正式な測定は専門業者や弁護士に相談。<br>詳しくは本文参照。</div>
    <div class="brand">防音Lab</div>
  </div>
</div></body></html>
