<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../memo-common.css"></head><body>
<div class="wrap">
  <span class="kicker">図解</span>
  <h1>窓の音の入り口と<br><em>カーテンの重さ</em></h1>
  <p class="lead">窓を横から見た断面。カーテンは窓ガラスの約20分の1の重さです。</p>
  <div class="fig">
    <svg viewBox="0 0 968 900" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="ag" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" refX="20" refY="12" orient="auto"><path d="M0,0 L24,12 L0,24 z" fill="#d4af37"/></marker>
        <marker id="aw" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" refX="20" refY="12" orient="auto"><path d="M0,0 L24,12 L0,24 z" fill="#e6a56a"/></marker>
      </defs>
      <text x="90" y="40" text-anchor="middle" class="m b">外</text>
      <text x="800" y="40" text-anchor="middle" class="m b">室内</text>
      <rect x="290" y="80" width="40" height="40" fill="#6b5640"/>
      <rect x="300" y="120" width="20" height="380" fill="#9fc3d1" opacity=".8"/>
      <rect x="290" y="500" width="40" height="40" fill="#6b5640"/>
      <text x="310" y="72" text-anchor="middle" class="s">サッシ</text>
      <text x="230" y="580" text-anchor="middle" class="s">窓ガラス 5mm</text>
      <rect x="440" y="60" width="90" height="14" fill="#c9bda6"/>
      <text x="485" y="50" text-anchor="middle" class="s">レール</text>
      <path d="M480,100 q14,30 0,60 q-14,30 0,60 q14,30 0,60 q-14,30 0,60 q14,30 0,60 q-14,30 0,60 q14,30 0,40" stroke="#d4af37" stroke-width="10" fill="none"/>
      <text x="530" y="470" class="s g">カーテン</text>
      <line x1="40" y1="600" x2="928" y2="600" stroke="#c9bda6" stroke-width="4"/>
      <text x="920" y="590" text-anchor="end" class="s">床</text>
      <line x1="60" y1="300" x2="290" y2="300" stroke="#d4af37" stroke-width="5" marker-end="url(#ag)"/>
      <line x1="330" y1="300" x2="460" y2="300" stroke="#d4af37" stroke-width="5" stroke-dasharray="10 7" marker-end="url(#ag)"/>
      <text x="40" y="275" class="s g">ガラスが揺れて入る音</text>
      <path d="M60,150 L420,150" stroke="#e6a56a" stroke-width="5" stroke-dasharray="10 7" fill="none"/>
      <text x="40" y="192" class="s w">サッシのすき間から</text><text x="40" y="224" class="s w">入る音</text>
      <path d="M420,150 Q520,90 600,120" stroke="#e6a56a" stroke-width="5" fill="none" marker-end="url(#aw)"/>
      <text x="612" y="130" class="s w">上のすき間</text>
      <path d="M380,560 Q470,610 600,560" stroke="#e6a56a" stroke-width="5" fill="none" marker-end="url(#aw)"/>
      <text x="612" y="560" class="s w">下のすき間</text>
      <text x="612" y="320" class="s">左右のすき間からも</text>
      <text x="612" y="352" class="s">回り込む</text>
      <text x="40" y="670" class="m b">1m²あたりの重さ（面密度）</text>
      <text x="40" y="730" class="m">窓ガラス 5mm</text>
      <rect x="290" y="702" width="500" height="40" rx="6" fill="#9fc3d1"/>
      <text x="805" y="732" class="m b">12.5kg/m²</text>
      <text x="40" y="800" class="m">カーテン</text>
      <rect x="290" y="772" width="25" height="40" rx="4" fill="#d4af37"/>
      <text x="330" y="802" class="m b g">0.59〜0.62kg/m²（約20分の1）</text>
      <text x="40" y="860" class="s">ニトリ3商品の重量÷4.0m²で計算</text>
    </svg>
  </div>
  <div class="foot">
    <div>※模式図。12.5kg/m²＝5mm×2.5、12.5÷0.62＝約20。<br>出典は本文参照。</div>
    <div class="brand">防音Lab</div>
  </div>
</div></body></html>
