<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../memo-common.css"></head><body>
<div class="wrap">
  <span class="kicker">図解</span>
  <h1>カーテンの測り方は<br><em>レールが基準</em></h1>
  <p class="lead">窓枠ではなく、カーテンレールから測ります（ニトリ公式の測り方）。</p>
  <div class="fig">
    <svg viewBox="0 0 968 740" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="a" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto-start-reverse"><path d="M0,0 L20,10 L0,20 z" fill="#d4af37"/></marker>
        <marker id="w" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,0 L20,10 L0,20 z" fill="#e6a56a"/></marker>
      </defs>
      <text x="230" y="36" text-anchor="middle" class="m b">掃き出し窓</text>
      <rect x="50" y="90" width="360" height="10" fill="#c9bda6"/>
      <circle cx="70" cy="110" r="10" fill="#d4af37"/><circle cx="390" cy="110" r="10" fill="#d4af37"/>
      <rect x="90" y="140" width="280" height="460" fill="none" stroke="#6b5640" stroke-width="8"/>
      <line x1="230" y1="140" x2="230" y2="600" stroke="#6b5640" stroke-width="6"/>
      <line x1="20" y1="610" x2="460" y2="610" stroke="#c9bda6" stroke-width="5"/>
      <text x="40" y="645" class="s">床</text>
      <line x1="76" y1="68" x2="384" y2="68" stroke="#d4af37" stroke-width="4" marker-start="url(#a)" marker-end="url(#a)"/>
      <line x1="440" y1="122" x2="440" y2="604" stroke="#d4af37" stroke-width="4" marker-start="url(#a)" marker-end="url(#a)"/>
      <text x="230" y="690" text-anchor="middle" class="m g b">丈＝ランナーの下から床</text>
      <text x="230" y="726" text-anchor="middle" class="s">そこからマイナス1cmくらい</text>
      <text x="720" y="36" text-anchor="middle" class="m b">腰窓</text>
      <rect x="540" y="90" width="360" height="10" fill="#c9bda6"/>
      <circle cx="560" cy="110" r="10" fill="#d4af37"/><circle cx="880" cy="110" r="10" fill="#d4af37"/>
      <rect x="580" y="140" width="280" height="250" fill="none" stroke="#6b5640" stroke-width="8"/>
      <line x1="720" y1="140" x2="720" y2="390" stroke="#6b5640" stroke-width="6"/>
      <text x="720" y="430" text-anchor="middle" class="s">窓枠の下</text>
      <line x1="566" y1="68" x2="874" y2="68" stroke="#d4af37" stroke-width="4" marker-start="url(#a)" marker-end="url(#a)"/>
      <line x1="930" y1="122" x2="930" y2="388" stroke="#d4af37" stroke-width="4" marker-start="url(#a)" marker-end="url(#a)"/>
      <line x1="930" y1="396" x2="930" y2="500" stroke="#e6a56a" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#w)"/>
      <text x="720" y="540" text-anchor="middle" class="m g b">丈＝ランナーの下から窓枠の下</text>
      <text x="720" y="576" text-anchor="middle" class="s w">そこからプラス15〜20cm（点線）</text>
      <text x="720" y="660" text-anchor="middle" class="s">上の矢印＝幅</text>
      <text x="720" y="692" text-anchor="middle" class="s">（固定ランナーの中心から中心）</text>
    </svg>
  </div>
  <div class="bar">計算例：床まで200cm → 199cm<br>窓枠の下まで110cm → 125〜130cm</div>
  <div class="foot">
    <div>※機能レールの例。装飾レールはキャップの付け根から測ります。<br>出典は本文参照。</div>
    <div class="brand">防音Lab</div>
  </div>
</div></body></html>
