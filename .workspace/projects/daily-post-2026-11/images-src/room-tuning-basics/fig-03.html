<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../memo-common.css"></head><body>
<div class="wrap">
  <span class="kicker">図解</span>
  <h1>反響と定在波は<br><em>別の現象</em></h1>
  <p class="lead">反響は「音が残る時間」、定在波は「場所で低音の大きさが変わる」こと。</p>
  <div class="fig">
    <svg viewBox="0 0 968 640" xmlns="http://www.w3.org/2000/svg">
      <defs><marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d4af37"/></marker></defs>
      <!-- 左：反響 -->
      <text x="230" y="40" text-anchor="middle" class="m b g">反響（響き）</text>
      <rect x="40" y="70" width="380" height="380" fill="none" stroke="#c9bda6" stroke-width="5"/>
      <circle cx="100" cy="390" r="16" fill="#d4af37"/>
      <polyline points="100,390 420,250 180,70 40,200 300,450 420,350 340,70" fill="none" stroke="#d4af37" stroke-width="4" stroke-dasharray="12 6" marker-end="url(#ag)"/>
      <text x="230" y="500" text-anchor="middle" class="m">壁や天井で何度も跳ね返り</text>
      <text x="230" y="536" text-anchor="middle" class="m">遅れて届き続ける</text>
      <text x="230" y="590" text-anchor="middle" class="s">手を叩いたあとの「ワーン」</text>
      <!-- 右：定在波 -->
      <text x="720" y="40" text-anchor="middle" class="m b w">定在波</text>
      <line x1="530" y1="70" x2="530" y2="450" stroke="#c9bda6" stroke-width="8"/>
      <line x1="910" y1="70" x2="910" y2="450" stroke="#c9bda6" stroke-width="8"/>
      <line x1="530" y1="260" x2="910" y2="260" stroke="#4a3b2a" stroke-width="2"/>
      <path d="M530,110 C 650,110 680,260 720,260 C 760,260 790,110 910,110" fill="none" stroke="#e6a56a" stroke-width="5"/>
      <path d="M530,410 C 650,410 680,260 720,260 C 760,260 790,410 910,410" fill="none" stroke="#e6a56a" stroke-width="5"/>
      <text x="560" y="96" class="s w">山（壁際）</text>
      <line x1="720" y1="268" x2="720" y2="392" stroke="#c9bda6" stroke-width="2" stroke-dasharray="4 5"/>
      <text x="720" y="422" text-anchor="middle" class="s">谷（中央・壁から1.8m）</text>
      <text x="720" y="500" text-anchor="middle" class="m">長辺3.6mの壁のあいだ</text>
      <text x="720" y="536" text-anchor="middle" class="m w b">約47Hzの低音</text>
      <text x="720" y="590" text-anchor="middle" class="s">席によって低音の大きさが違う</text>
    </svg>
  </div>
