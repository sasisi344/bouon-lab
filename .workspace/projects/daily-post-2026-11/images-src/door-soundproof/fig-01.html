<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../memo-common.css"></head><body>
<div class="wrap">
  <span class="kicker">図解</span>
  <h1>ドアの音は<br><em>隙間</em>から先に探す</h1>
  <p class="lead">材料を足す前に、ドア下と戸当たりの上・横を確かめる。</p>
  <div class="fig"><svg viewBox="0 0 968 760" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="ad" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="16" refY="11" orient="auto"><path d="M0,0 L22,11 L0,22 z" fill="#c9bda6"/></marker>
    </defs>
    <text x="40" y="52" class="m b">廊下のテレビの声が、どこから入るか</text>
    <text x="40" y="88" class="s">室内側から見たドア（模式図）</text>
    <rect x="40" y="110" width="440" height="560" fill="#2e241b" stroke="#4a3b2a" stroke-width="2"/>
    <text x="60" y="146" class="s">壁</text>
    <rect x="110" y="170" width="300" height="480" fill="none" stroke="#a8946c" stroke-width="14"/>
    <rect x="126" y="186" width="268" height="440" fill="#6b5640"/>
    <circle cx="370" cy="420" r="9" fill="#d4af37"/>
    <line x1="126" y1="180" x2="394" y2="180" stroke="#e6a56a" stroke-width="7" stroke-dasharray="14 8"/>
    <line x1="400" y1="186" x2="400" y2="626" stroke="#e6a56a" stroke-width="7" stroke-dasharray="14 8"/>
    <rect x="126" y="628" width="268" height="18" fill="#e6a56a"/>
    <g class="m">
      <line x1="394" y1="180" x2="530" y2="190" stroke="#c9bda6" stroke-width="2"/>
      <text x="540" y="200" class="w b">戸当たりの上</text>
      <line x1="404" y1="320" x2="530" y2="320" stroke="#c9bda6" stroke-width="2"/>
      <text x="540" y="330" class="w b">戸当たりの横</text>
      <line x1="394" y1="637" x2="530" y2="610" stroke="#c9bda6" stroke-width="2"/>
      <text x="540" y="620" class="w b">ドア下</text>
      <text x="540" y="656" class="s">閉めた状態で目で見る</text>
    </g>
    <line x1="260" y1="290" x2="260" y2="460" stroke="#c9bda6" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#ad)"/>
    <text x="260" y="510" text-anchor="middle" class="s" style="fill:#f4ecdc">ドア本体</text>
    <text x="260" y="542" text-anchor="middle" class="s" style="fill:#f4ecdc">からも通る</text>
    <line x1="448" y1="390" x2="448" y2="540" stroke="#c9bda6" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#ad)"/>
    <line x1="460" y1="460" x2="530" y2="460" stroke="#c9bda6" stroke-width="2"/>
    <text x="540" y="470" class="m">周りの壁からも伝わる</text>
    <text x="40" y="722" class="s">オレンジ：先に確かめる隙間／点線：隙間をふさいでも残る経路</text>
  </svg></div>
  <div class="foot">
    <div>※位置関係の模式図。隙間の幅や音の量を表すものではありません。<br>出典は本文参照。</div>
    <div class="brand">防音Lab</div>
  </div>
</div></body></html>
