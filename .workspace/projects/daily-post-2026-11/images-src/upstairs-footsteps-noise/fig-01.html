<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../memo-common.css"></head><body>
<div class="wrap">
  <span class="kicker">図解</span>
  <h1>ドスドスは<br><em>床ごと揺れて</em>届く</h1>
  <p class="lead">軽い音と重い音では、伝わり方も効く対策も違う。</p>
  <div class="fig"><svg viewBox="0 0 968 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="ag" markerUnits="userSpaceOnUse" markerWidth="28" markerHeight="28" refX="22" refY="14" orient="auto"><path d="M0,0 L28,14 L0,28 z" fill="#8fc9a0"/></marker>
      <marker id="aw" markerUnits="userSpaceOnUse" markerWidth="28" markerHeight="28" refX="22" refY="14" orient="auto"><path d="M0,0 L28,14 L0,28 z" fill="#e6a56a"/></marker>
    </defs>
    <text x="40" y="56" class="m b">上の階</text>
    <text x="250" y="120" text-anchor="middle" class="m w b">かかとの衝撃</text>
    <line x1="250" y1="134" x2="250" y2="196" stroke="#e6a56a" stroke-width="10" marker-end="url(#aw)"/>
    <text x="700" y="120" text-anchor="middle" class="m o b">スプーンを落とす</text>
    <line x1="700" y1="134" x2="700" y2="196" stroke="#8fc9a0" stroke-width="6" marker-end="url(#ag)"/>
    <rect x="560" y="200" width="280" height="22" rx="6" fill="#8fc9a0"/>
    <path d="M40,222 Q250,262 460,222 L460,330 Q250,370 40,330 Z" fill="#6b5640"/>
    <rect x="460" y="222" width="468" height="108" fill="#6b5640"/>
    <text x="250" y="294" text-anchor="middle" class="m b">床全体が揺れる</text>
    <rect x="40" y="380" width="888" height="14" fill="#b9ab8f"/>
    <text x="900" y="420" text-anchor="end" class="s">下の階の天井</text>
    <text x="40" y="460" class="m b">下の階</text>
    <line x1="250" y1="400" x2="250" y2="520" stroke="#e6a56a" stroke-width="10" marker-end="url(#aw)"/>
    <text x="250" y="566" text-anchor="middle" class="m w b">天井から低い音</text>
    <text x="250" y="606" text-anchor="middle" class="m w b">体にも響く</text>
    <line x1="700" y1="400" x2="700" y2="470" stroke="#8fc9a0" stroke-width="3" stroke-dasharray="6 6"/>
    <text x="700" y="520" text-anchor="middle" class="s" style="fill:#f4ecdc">軽い衝撃音</text>
    <text x="700" y="560" text-anchor="middle" class="s o">カーペットは主に軽い衝撃へ</text>
    <rect x="40" y="640" width="420" height="56" rx="14" fill="#2e241b" stroke="#e6a56a" stroke-width="2"/>
    <text x="250" y="678" text-anchor="middle" class="m b">重量床衝撃音</text>
    <text x="500" y="678" class="s">重い衝撃には、床の重さ・硬さが効く</text>
  </svg></div>
