<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../memo-common.css"></head><body>
<div class="wrap">
  <span class="kicker">図解</span>
  <h1>下地で弱まるのは<br><em>軽い音</em>だけ</h1>
  <p class="lead">重い音は床全体をたわませ、コンクリートごと揺れて下に届く。</p>
  <div class="fig"><svg viewBox="0 0 968 700" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="ag" markerUnits="userSpaceOnUse" markerWidth="28" markerHeight="28" refX="22" refY="14" orient="auto"><path d="M0,0 L28,14 L0,28 z" fill="#8fc9a0"/></marker>
      <marker id="aw" markerUnits="userSpaceOnUse" markerWidth="28" markerHeight="28" refX="22" refY="14" orient="auto"><path d="M0,0 L28,14 L0,28 z" fill="#e6a56a"/></marker>
    </defs>
    <text x="40" y="60" class="m b">上の階の室内</text>
    <rect x="40" y="150" width="560" height="26" fill="#e8d070"/>
    <rect x="40" y="176" width="560" height="30" fill="#8fc9a0"/>
    <rect x="40" y="206" width="560" height="34" fill="#a8946c"/>
    <rect x="40" y="240" width="560" height="150" fill="#6b5640"/>
    <rect x="40" y="440" width="560" height="14" fill="#b9ab8f"/>
    <text x="40" y="530" class="m b">下の階の室内</text>
    <g class="m">
      <line x1="600" y1="163" x2="630" y2="163" stroke="#c9bda6" stroke-width="2"/><text x="640" y="172">フロアタイル（表面材）</text>
      <line x1="600" y1="191" x2="630" y2="218" stroke="#c9bda6" stroke-width="2"/><text x="640" y="227" class="o b">クッション材</text>
      <line x1="600" y1="223" x2="630" y2="274" stroke="#c9bda6" stroke-width="2"/><text x="640" y="283">既存の床</text>
      <line x1="600" y1="320" x2="630" y2="334" stroke="#c9bda6" stroke-width="2"/><text x="640" y="343">コンクリートスラブ</text>
      <line x1="600" y1="447" x2="630" y2="447" stroke="#c9bda6" stroke-width="2"/><text x="640" y="456">下の階の天井</text>
    </g>
    <text x="170" y="110" text-anchor="middle" class="m o b">軽い音（コツン）</text>
    <line x1="170" y1="122" x2="170" y2="186" stroke="#8fc9a0" stroke-width="6" marker-end="url(#ag)"/>
    <text x="170" y="300" text-anchor="middle" class="s" style="fill:#f4ecdc">クッションで弱まる</text>
    <line x1="170" y1="390" x2="170" y2="430" stroke="#8fc9a0" stroke-width="3" stroke-dasharray="6 6"/>
    <text x="440" y="110" text-anchor="middle" class="m w b">重い音（ドン）</text>
    <line x1="440" y1="122" x2="440" y2="430" stroke="#e6a56a" stroke-width="10" marker-end="url(#aw)"/>
    <path d="M300,405 Q440,440 580,405" stroke="#e6a56a" stroke-width="4" fill="none"/>
    <text x="440" y="500" text-anchor="middle" class="s w b">スラブごと揺れて届く</text>
    <text x="484" y="610" text-anchor="middle" class="s">12mmのマット（1991年の試験）：軽い音はマットだけで20dB、</text>
    <text x="484" y="646" text-anchor="middle" class="s">木質フロア仕上げで10dB下がり、重い音は大きく変わらなかった</text>
  </svg></div>
  <div class="foot">
    <div>※断面の模式図。厚みは実際の比率ではありません。<br>出典は本文参照。</div>
    <div class="brand">防音Lab</div>
  </div>
</div></body></html>
