<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../memo-common.css"><style>.tag{width:230px}</style></head><body>
<div class="wrap">
  <span class="kicker">保存版メモ</span>
  <h1>その音に<br><em>防音カーテンは向く？</em></h1>
  <p class="lead">最初の質問は1つ。減らしたいのは、どちら向きの音？</p>
  <div class="card"><h2><span class="num">1</span>外から入る音</h2>
    <div class="row"><span class="tag ok">効きやすい</span><span class="val">隣の家の話し声・犬の鳴き声</span></div>
    <div class="row"><span class="tag">一部だけ</span><span class="val">車・バイク。足りなければ内窓</span></div>
    <div class="row"><span class="tag warn">ほとんど効かない</span><span class="val">電車・トラックの低音。内窓を検討</span></div>
  </div>
  <div class="card"><h2><span class="num">2</span>部屋から出る音</h2>
    <div class="row"><span class="tag warn">防ぎきれない</span><span class="val">自分の楽器・歌。管理会社や専門家に相談</span></div>
  </div>
  <div class="bar">カーテンが向くなら、試験値・重さ・サイズで選ぶ。</div>
  <div class="foot">
    <div>※音の種類ごとの傾向の整理で、減音量の数値ではありません。<br>詳しくは本文参照。</div>
    <div class="brand">防音Lab</div>
  </div>
</div></body></html>
