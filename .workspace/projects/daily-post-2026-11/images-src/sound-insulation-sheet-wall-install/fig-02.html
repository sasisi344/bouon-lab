<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../memo-common.css"></head><body>
<div class="wrap">
  <span class="kicker">図解</span>
  <h1>賃貸で跡を残さない<br><em>遮音シートの重ね方</em></h1>
  <p class="lead">壁のクロスにマスキングテープを先に貼り、剥がせる層を作る。</p>
  <div class="fig"><svg viewBox="0 0 968 640" xmlns="http://www.w3.org/2000/svg">
    <text x="90" y="300" text-anchor="middle" class="m b">隣室</text>
    <text x="890" y="300" text-anchor="middle" class="m b">室内</text>
    <rect x="170" y="50" width="70" height="500" fill="#b9ab8f"/>
    <rect x="240" y="50" width="10" height="500" fill="#f4ecdc"/>
    <rect x="250" y="50" width="12" height="500" fill="#8fc9a0"/>
    <rect x="262" y="50" width="10" height="500" fill="#e6a56a"/>
    <rect x="272" y="50" width="22" height="500" fill="#d4af37"/>
    <rect x="320" y="50" width="70" height="500" fill="none" stroke="#b9ab8f" stroke-width="4" stroke-dasharray="12 8"/>
    
    <g class="m">
      <line x1="205" y1="110" x2="430" y2="110" stroke="#c9bda6" stroke-width="2"/><text x="440" y="110">既存の壁（石膏ボード12.5mm）</text><text x="440" y="144" class="s">約8.5kg/m²</text>
      <line x1="245" y1="180" x2="430" y2="180" stroke="#c9bda6" stroke-width="2"/><text x="440" y="189">クロス（壁紙）</text>
      <line x1="256" y1="250" x2="430" y2="250" stroke="#8fc9a0" stroke-width="2"/><text x="440" y="259" class="o b">① マスキングテープ</text>
      <line x1="267" y1="320" x2="430" y2="320" stroke="#e6a56a" stroke-width="2"/><text x="440" y="329" class="w b">② 両面テープ</text>
      <line x1="283" y1="390" x2="430" y2="390" stroke="#d4af37" stroke-width="2"/><text x="440" y="399" class="g b">③ 遮音シート1.2mm（2.1kg/m²）</text>
      <line x1="390" y1="460" x2="430" y2="460" stroke="#b9ab8f" stroke-width="2"/><text x="440" y="469">足す場合：石膏ボード（点線）</text>
    </g>
    <text x="484" y="620" text-anchor="middle" class="s">壁1面（8.64m²）のシートは約19kg。小さい面で貼って、落ちないか確かめてから広げる</text>
  </svg></div>
  <div class="foot">
    <div>※上から見た断面の模式図。厚みは実際の比率ではありません。<br>貼る前に管理会社に確認。出典は本文参照。</div>
    <div class="brand">防音Lab</div>
  </div>
