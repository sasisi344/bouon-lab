<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../memo-common.css"><link rel="stylesheet" href="../flow.css"></head><body>
<div class="wrap">
  <span class="kicker">保存版メモ</span>
  <h1>騒音の苦情は<br><em>どこに言えばいい？</em></h1>
  <p class="lead">上から順に当てはめて、最初の相談先を1つ選ぶ1枚。</p>
  <div class="card"><h2><span class="num">1</span>今すぐ対応が必要？</h2>
    <div class="two">
      <div class="box"><b>緊急（身の危険など）</b>110番</div>
      <div class="box"><b>緊急ではない</b>ステップ2へ</div>
    </div>
  </div>
  <div class="arrow">▼</div>
  <div class="card"><h2><span class="num">2</span>住まいはどっち？</h2>
    <div class="two">
      <div class="box"><b>集合住宅</b>管理会社・大家<br>（分譲は管理組合も）</div>
      <div class="box"><b>戸建て</b>市区町村の<br>公害苦情相談窓口</div>
    </div>
  </div>
  <div class="arrow">▼ 管理側に伝えても進まないとき</div>
  <div class="card"><h2><span class="num">3</span>次の相談先</h2>
    <div class="row"><span class="tag">自治体</span><span class="val">市区町村の公害苦情相談窓口</span></div>
    <div class="row"><span class="tag">警察</span><span class="val">緊急でない相談は #9110・最寄りの警察署</span></div>
  </div>
  <div class="bar">どこに言うときも、<br>日時・場所・音の種類・暮らしへの影響の記録を添える</div>
  <div class="foot">
    <div>※窓口の案内は2026年11月の確認。法律の判断ではありません。<br>出典は本文参照。</div>
    <div class="brand">防音Lab</div>
  </div>
</div></body></html>
