<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../memo-common.css"></head><body>
<div class="wrap">
  <span class="kicker">図解</span>
  <h1>3畳を自作する材料費と<br><em>10万円の線</em></h1>
  <p class="lead">響きを減らす部屋は収まり、2枚張りの箱は超える。</p>
  <div class="fig"><svg viewBox="0 0 968 720" xmlns="http://www.w3.org/2000/svg">
    <text x="40" y="60" class="m b">響きを減らす録音部屋（箱は作らない）</text>
    <rect x="40" y="82" width="357" height="70" rx="10" fill="#8fc9a0"/>
    <text x="415" y="130" class="m b">約5.1万円</text>
    <text x="40" y="190" class="s">吸音材4枚とパッキン。音漏れはほとんど減らない</text>

    <text x="40" y="270" class="m b">石膏ボード1枚張りの箱（3畳）</text>
    <rect x="40" y="292" width="553" height="70" rx="10" fill="#d4af37"/>
    <rect x="593" y="292" width="147" height="70" fill="none" stroke="#d4af37" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="60" y="338" class="m b" style="fill:#17120e">約7.9万円</text>
    <text x="40" y="400" class="s">残り約2.1万円で、ドア・ビス・工具など</text>

    <text x="40" y="480" class="m b">2枚張り＋遮音シートの箱（3畳）</text>
    <rect x="40" y="502" width="804" height="70" rx="10" fill="#e6a56a"/>
    <text x="60" y="548" class="m b" style="fill:#17120e">約11.5万円</text>
    <text x="40" y="610" class="s">ドアなしで約1.5万円足りない</text>

    <line x1="740" y1="30" x2="740" y2="640" stroke="#fff3d0" stroke-width="4"/>
    <text x="740" y="684" text-anchor="middle" class="m w b">10万円</text>
  </svg></div>
  <div class="foot">
    <div>※2026年11月25日の通販の表示価格（税込）で計算。<br>ドア・ビス・工具・運搬は含まない。数量と出典は本文参照。</div>
    <div class="brand">防音Lab</div>
  </div>
</div></body></html>
