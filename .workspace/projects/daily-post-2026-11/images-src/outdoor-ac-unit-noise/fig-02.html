<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../memo-common.css"></head><body>
<div class="wrap">
  <span class="kicker">図解</span>
  <h1>距離を2倍にしても<br><em>半分には聞こえない</em></h1>
  <p class="lead">反射のない理想条件で、下がるのは約6dB。</p>
  <div class="fig"><svg viewBox="0 0 968 780" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="ag" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="11" refY="11" orient="auto"><path d="M0,0 L22,11 L0,22 z" fill="#c9bda6"/></marker>
    </defs>
    <rect x="40" y="90" width="130" height="110" rx="12" fill="#6b5640" stroke="#a8946c" stroke-width="3"/>
    <circle cx="90" cy="145" r="36" fill="#2e241b" stroke="#a8946c" stroke-width="3"/>
    <text x="105" y="234" text-anchor="middle" class="s">室外機</text>
    <rect x="440" y="80" width="18" height="130" fill="#e8d070"/>
    <text x="449" y="64" text-anchor="middle" class="m b">窓</text>
    <rect x="860" y="80" width="18" height="130" fill="#e8d070"/>
    <text x="869" y="64" text-anchor="middle" class="m b">窓</text>
    <line x1="170" y1="270" x2="440" y2="270" stroke="#c9bda6" stroke-width="3" marker-end="url(#ag)"/>
    <text x="305" y="310" text-anchor="middle" class="m">2m</text>
    <line x1="170" y1="350" x2="860" y2="350" stroke="#c9bda6" stroke-width="3" marker-end="url(#ag)"/>
    <text x="515" y="390" text-anchor="middle" class="m">4m（距離が2倍）</text>
    <text x="484" y="450" text-anchor="middle" class="m g b">20 × log10（4 ÷ 2）≒ 6.02dB ＝ 約6dB</text>
    <line x1="40" y1="490" x2="928" y2="490" stroke="#4a3b2a" stroke-width="2"/>
    <text x="40" y="536" class="m b">下がる量のくらべ</text>
    <text x="40" y="590" class="m">距離2倍</text>
    <rect x="260" y="566" width="96" height="34" rx="6" fill="#d4af37"/>
    <text x="370" y="592" class="m g b">約6dB</text>
    <text x="40" y="648" class="m">10dB</text>
    <rect x="260" y="624" width="160" height="34" rx="6" fill="#8fc9a0"/>
    <text x="434" y="650" class="m o b">およそ半分の大きさに感じる</text>
    <text x="40" y="706" class="m">会話とささやき</text>
    <rect x="260" y="682" width="480" height="34" rx="6" fill="#a8946c"/>
    <text x="754" y="708" class="m b">30dBの差</text>
    <text x="40" y="760" class="s">壁の反射や囲まれた配置では、計算どおりに下がらない</text>
  </svg></div>
  <div class="foot">
    <div>※理想条件の計算図。仕様表の値から寝室の音を求める図ではありません。<br>出典は本文参照。</div>

  </div>
</div></body></html>
