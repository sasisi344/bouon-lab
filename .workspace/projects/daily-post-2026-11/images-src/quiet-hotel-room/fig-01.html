<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../memo-common.css"></head><body>
<div class="wrap">
  <span class="kicker">図解</span>
  <h1>ホテルの口コミで<br><em>気になった音</em>の内訳</h1>
  <p class="lead">音に具体的に触れた343件。いちばん多いのは隣室・上下階。</p>
  <div class="fig"><svg viewBox="0 0 968 640" xmlns="http://www.w3.org/2000/svg">
    <text x="40" y="54" class="m b">隣室・上下階</text><rect x="40" y="70" width="546" height="52" rx="8" fill="#d4af37"/><text x="604" y="107" class="m b">32.1%（110件）</text>
    <text x="40" y="172" class="m b">外部（電車・道路など）</text><rect x="40" y="188" width="367" height="52" rx="8" fill="#e6a56a"/><text x="425" y="225" class="m b">21.6%（74件）</text>
    <text x="40" y="290" class="m b">廊下・ドア</text><rect x="40" y="306" width="179" height="52" rx="8" fill="#8fc9a0"/><text x="237" y="343" class="m b">10.5%（36件）</text>
    <text x="40" y="408" class="m b">設備（空調・配管など）</text><rect x="40" y="424" width="54" height="52" rx="8" fill="#8fb4d9"/><text x="112" y="461" class="m b">3.2%（11件）</text>
    <text x="40" y="526" class="m b">不明（「壁が薄い」だけなど）</text><rect x="40" y="542" width="556" height="52" rx="8" fill="#8a8078"/><text x="614" y="579" class="m b">32.7%（112件）</text>
  </svg></div>
  <div class="foot">
    <div>※騒音の口コミが多い100軒の集計で、<br>ホテル全体の傾向ではない。出典は本文参照。</div>

  </div>
