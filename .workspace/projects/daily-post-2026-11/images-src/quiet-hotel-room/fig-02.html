<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../memo-common.css"><link rel="stylesheet" href="../flow.css"></head><body>
<div class="wrap">
  <span class="kicker">保存版メモ</span>
  <h1>ホテルの<em>静かな部屋</em>は<br>3回伝える</h1>
  <p class="lead">予約前に音の種類を調べて、予約時・電話・チェックインで伝える。</p>
  <div class="card"><h2>予約前に調べる</h2>
    <div class="row"><span class="tag">口コミ</span><span class="val">「壁」「配管」「電車」が何度も出るか</span></div>
    <div class="row"><span class="tag">立地</span><span class="val">駅から300m未満なら外の音を疑う</span></div>
    <div class="row"><span class="tag">施設</span><span class="val">宴会場・工事の案内がないか</span></div></div>
  <div class="arrow">▼</div>
  <div class="card"><h2>1回目　予約時</h2>
    <div class="row"><span class="tag">伝える</span><span class="val">要望欄などで、静かな部屋を希望</span></div></div>
  <div class="card"><h2>2回目　到着前の電話</h2>
    <div class="row"><span class="tag">伝える</span><span class="val">希望をもう一度伝えて確かめる</span></div></div>
  <div class="card"><h2>3回目　チェックイン</h2>
    <div class="row"><span class="tag">伝える</span><span class="val">希望を再確認。だめなら部屋の変更を頼む</span></div></div>
  <div class="bar">離れたい所：エレベーター・階段・自動販売機・プール</div>
  <div class="foot">
    <div>※希望は確約ではない。<br>出典は本文参照。</div>
    <div class="brand">防音Lab</div>
  </div>
</div></body></html>
