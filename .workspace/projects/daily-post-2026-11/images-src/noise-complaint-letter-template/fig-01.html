<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../memo-common.css">
<style>
.letter{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:26px 30px;margin-bottom:22px}
.blk{display:flex;gap:18px;align-items:flex-start;padding:16px 0;border-top:2px dashed var(--line)}
.blk:first-child{border-top:none;padding-top:4px}
.blk .tag{width:150px;flex:none}
.blk .val{font-size:28px;line-height:1.5}
.blk .val small{display:block;font-size:24px;color:var(--dim);margin-top:2px}
.no{background:var(--card2);border:3px dashed var(--warn);border-radius:22px;padding:22px 30px;font-size:28px;line-height:1.55}
.no b{color:var(--warn)}
</style></head><body>
<div class="wrap">
  <span class="kicker">図解</span>
  <h1>騒音苦情の手紙は<br><em>5つのブロック</em>で書く</h1>
  <p class="lead">伝える中身は「いつ・どんな音・どうしてほしいか」の3点。</p>
  <div class="letter">
    <div class="blk"><span class="tag">あいさつ</span><span class="val">位置だけ名乗る<small>例：突然のお手紙で失礼します。下の階の者です。</small></span></div>
    <div class="blk"><span class="tag ok">いつ</span><span class="val">期間と時間帯<small>例：ここ2週間ほど、夜11時すぎ</small></span></div>
    <div class="blk"><span class="tag ok">どんな音</span><span class="val">聞こえ方<small>例：床をドンと鳴らすような音</small></span></div>
    <div class="blk"><span class="tag ok">お願い</span><span class="val">1つだけ<small>例：夜の時間だけ、少し気にかけていただけると助かります</small></span></div>
    <div class="blk"><span class="tag">結び</span><span class="val">お手数をおかけします</span></div>
  </div>
  <div class="no"><b>書かない欄</b>：部屋番号・自分の名前<br>（名乗るか迷うなら、管理会社にだけ伝える）</div>
  <div class="foot">
    <div>※文例は本文のテンプレートから抜粋。<br>詳しくは本文参照。</div>
    <div class="brand">防音Lab</div>
  </div>
</div></body></html>
