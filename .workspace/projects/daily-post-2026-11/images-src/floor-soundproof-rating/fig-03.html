<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../memo-common.css"></head><body>
<div class="wrap">
  <span class="kicker">保存版メモ</span>
  <h1>床の防音等級<br><em>確かめる順番</em></h1>
  <p class="lead">自分のマンションの床が何等級かを、上から順に確かめる1枚。</p>
  <div class="card">
    <ul class="check">
      <li><span class="cb"></span><span class="t">管理規約・使用細則<small>フローリングの等級の指定（例：LL-45以上）があるか</small></span></li>
      <li><span class="cb"></span><span class="t">重要事項説明書・パンフレット・竣工図<small>床の遮音や、コンクリートの厚さの記載があるか</small></span></li>
      <li><span class="cb"></span><span class="t">住宅性能評価書（あれば）<small>相当スラブ厚の表示は27・20・15・11cm以上の4段階とその他</small></span></li>
      <li><span class="cb"></span><span class="t">管理会社に聞く<small>床材の品番と、カタログの等級表示</small></span></li>
    </ul>
  </div>
  <div class="bar">書類に書いていない項目は、無理に読み解かず管理会社に聞く。</div>
  <div class="foot">
    <div>※評価書の音環境は任意の項目で、載っていないマンションもあります。<br>出典は本文参照。</div>
    <div class="brand">防音Lab</div>
  </div>
</div></body></html>
