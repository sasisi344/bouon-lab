<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../memo-common.css"></head><body>
<div class="wrap">
  <span class="kicker">図解</span>
  <h1>吸音率は<br><em>音漏れを止める割合</em>ではない</h1>
  <p class="lead">反射しなかった音には、吸収された音と、向こうへ抜けた音の両方が入る。</p>
  <div class="fig"><svg viewBox="0 0 968 560" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d4af37"/></marker>
  <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6a56a"/></marker>
  <marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9bda6"/></marker>
</defs>
<text x="190" y="50" text-anchor="middle" class="m b">部屋の中</text>
<text x="800" y="50" text-anchor="middle" class="m b">壁の向こう</text>
<rect x="440" y="80" width="130" height="330" fill="#2e241b" stroke="#c9bda6" stroke-width="3" rx="6"/>
<text x="505" y="440" text-anchor="middle" class="m">吸音材</text>
<line x1="60" y1="150" x2="430" y2="230" stroke="#d4af37" stroke-width="8" marker-end="url(#ah)"/>
<text x="70" y="128" class="m b g">入射 I</text>
<line x1="430" y1="270" x2="80" y2="350" stroke="#c9bda6" stroke-width="5" marker-end="url(#ad)"/>
<text x="80" y="395" class="m b">反射 R（戻る）</text>
<circle cx="505" cy="245" r="34" fill="none" stroke="#8fc9a0" stroke-width="5" stroke-dasharray="8 6"/>
<text x="505" y="160" text-anchor="middle" class="m b o">吸収 A</text>
<line x1="580" y1="245" x2="900" y2="245" stroke="#e6a56a" stroke-width="5" marker-end="url(#aw)"/>
<text x="740" y="220" text-anchor="middle" class="m b w">透過 T（抜ける）</text>
<rect x="60" y="480" width="848" height="64" fill="#241c15" stroke="#4a3b2a" stroke-width="2" rx="12"/>
<text x="484" y="522" text-anchor="middle" class="m b">吸音率 α ＝ (I−R)÷I ＝ (A＋T)÷I</text>
  </svg></div>
  <div class="bar">吸音率が高くても、Tが大きければ隣への音漏れは減らない</div>
  <div class="foot">
    <div>※式は日本建設業連合会の用語解説「吸音率」による。<br>出典は本文参照。</div>
    <div class="brand">防音Lab</div>
  </div>
</div></body></html>
