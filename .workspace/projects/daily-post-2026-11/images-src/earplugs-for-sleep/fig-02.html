<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../memo-common.css"></head><body>
<div class="wrap">
  <span class="kicker">図解</span>
  <h1>耳栓が減らすのは<br><em>空気の音</em>だけ</h1>
  <p class="lead">床・ベッド・枕を揺らす振動は、耳をふさいでも残る。</p>
  <div class="fig"><svg viewBox="0 0 968 700" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="ag" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="20" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#8fc9a0"/></marker>
      <marker id="aw" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="20" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#e6a56a"/></marker>
    </defs>
    <text x="40" y="54" class="m b">空気を伝わる音</text>
    <rect x="40" y="76" width="290" height="240" rx="18" fill="#2e241b" stroke="#4a3b2a" stroke-width="2"/>
    <g class="m">
      <text x="70" y="124">話し声</text>
      <text x="70" y="166">いびき</text>
      <text x="70" y="208">車・バイク</text>
      <text x="70" y="250">工事</text>
    </g>
    <text x="70" y="294" class="s">高さの違う音が混ざる</text>
    <line x1="340" y1="196" x2="560" y2="196" stroke="#8fc9a0" stroke-width="10" marker-end="url(#ag)"/>
    <text x="450" y="166" text-anchor="middle" class="m o b">耳栓で軽減</text>
    <circle cx="720" cy="200" r="110" fill="#6b5640"/>
    <ellipse cx="626" cy="200" rx="22" ry="40" fill="#a8946c"/>
    <rect x="584" y="184" width="34" height="32" rx="12" fill="#e8d070"/>
    <text x="740" y="210" text-anchor="middle" class="m b">頭</text>
    <rect x="590" y="326" width="300" height="50" rx="24" fill="#a8946c"/>
    <text x="740" y="361" text-anchor="middle" class="m b" style="fill:#17120e">枕</text>
    <rect x="300" y="400" width="628" height="60" fill="#4a3b2a"/>
    <text x="614" y="440" text-anchor="middle" class="m">ベッド・床</text>
    <text x="40" y="420" class="m b">体に届く振動</text>
    <text x="40" y="458" class="m">足音のドスン</text>
    <line x1="160" y1="500" x2="290" y2="450" stroke="#e6a56a" stroke-width="8" marker-end="url(#aw)"/>
    <line x1="740" y1="398" x2="740" y2="384" stroke="#e6a56a" stroke-width="8" marker-end="url(#aw)"/>
    <line x1="840" y1="398" x2="840" y2="300" stroke="#e6a56a" stroke-width="8" marker-end="url(#aw)"/>
    <text x="40" y="570" class="m w b">床・ベッド・枕の振動は、耳栓では止まらない</text>
    <text x="40" y="630" class="s">音ごとに何dB減るかは断定できない</text>
    <text x="40" y="664" class="s">（商品のH・M・Lの値は、日常の音の減少量そのものではない）</text>
  </svg></div>
  <div class="foot">
    <div>※経路の模式図。耳栓の遮音値を示すものではありません。<br>出典は本文参照。</div>
    <div class="brand">防音Lab</div>
  </div>
</div></body></html>
