<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../memo-common.css">
<style>.card h2{font-size:36px;margin-bottom:8px}</style></head><body>
<div class="wrap">
  <span class="kicker">比較メモ</span>
  <h1>耳栓は素材名で<br><em>順位をつけない</em></h1>
  <p class="lead">気になる商品の説明を見ながら、ここを確かめる。</p>
  <div class="card"><h2>フォーム</h2>
    <div class="row"><span class="tag">形</span><span class="val">サイズ・入れ方の説明、耳から出る部分</span></div>
    <div class="row"><span class="tag ok">手入れ</span><span class="val">使い捨てか、交換をどう判断するか</span></div></div>
  <div class="card"><h2>シリコン</h2>
    <div class="row"><span class="tag">形</span><span class="val">耳の中に入れる形か、入り口を覆う形か</span></div>
    <div class="row"><span class="tag ok">手入れ</span><span class="val">洗えるか、乾かし方の指定はあるか</span></div></div>
  <div class="card"><h2>ワックス</h2>
    <div class="row"><span class="tag">形</span><span class="val">耳のどこに当てるか、枕に当たらないか</span></div>
    <div class="row"><span class="tag ok">手入れ</span><span class="val">再使用できるか、保管方法</span></div></div>
  <div class="card"><h2>フランジ型</h2>
    <div class="row"><span class="tag">形</span><span class="val">ひだのサイズ、軸が枕に当たらないか</span></div>
    <div class="row"><span class="tag ok">手入れ</span><span class="val">素材、洗浄・交換の指定</span></div></div>
  <div class="bar">共通：横向きで枕に当たらないか。<br>手入れ・交換は製品の説明を確認する。</div>
  <div class="foot">
    <div>※素材ごとの遮音値は載せていません。<br>出典は本文参照。</div>
    <div class="brand">防音Lab</div>
  </div>
</div></body></html>
