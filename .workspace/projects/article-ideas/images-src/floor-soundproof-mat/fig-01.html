<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="memo-common.css">
  <style>
    .cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px; margin-top:28px; }
    .card { padding:26px 24px; margin:0; }
    .card h2 { font-size:34px; margin-bottom:18px; }
    .row { gap:14px; }
    .tag { width:100px; }
    .val { white-space:nowrap; font-variant-numeric:tabular-nums; }
    .foot { margin-top:26px; font-size:24px; }
  </style>
</head>
<body>
  <main class="wrap">
    <span class="kicker">保存版メモ</span>
    <h1><em>床の防音マット</em>の種類を比べる</h1>
    <div class="cards">
      <section class="card">
        <h2>静床ライト</h2>
        <div class="row"><span class="tag">厚さ</span><span class="val">9.5mm</span></div>
        <div class="row"><span class="tag">大きさ</span><span class="val">50×50cm</span></div>
        <div class="row"><span class="tag">重さ</span><span class="val">約1.5kg</span></div>
        <div class="row"><span class="tag">価格</span><span class="val">11,000円（10枚）</span></div>
      </section>
      <section class="card">
        <h2>MUTE バラ</h2>
        <div class="row"><span class="tag">厚さ</span><span class="val">17.5mm</span></div>
        <div class="row"><span class="tag">大きさ</span><span class="val">50×50cm</span></div>
        <div class="row"><span class="tag">重さ</span><span class="val">1,500g</span></div>
        <div class="row"><span class="tag">価格</span><span class="val">2,180円</span></div>
      </section>
      <section class="card">
        <h2>MUTE ラグ</h2>
        <div class="row"><span class="tag">厚さ</span><span class="val">12mm</span></div>
        <div class="row"><span class="tag">大きさ</span><span class="val">150×200cm</span></div>
        <div class="row"><span class="tag">重さ</span><span class="val">5,000g</span></div>
        <div class="row"><span class="tag">価格</span><span class="val">38,500円</span></div>
      </section>
      <section class="card">
        <h2>MUTE ピアノマット</h2>
        <div class="row"><span class="tag">厚さ</span><span class="val">12mm</span></div>
        <div class="row"><span class="tag">大きさ</span><span class="val">150×50cm</span></div>
        <div class="row"><span class="tag">重さ</span><span class="val">1,400g</span></div>
        <div class="row"><span class="tag">価格</span><span class="val">8,360円</span></div>
      </section>
    </div>
    <footer class="foot">
      <div>※価格は2026年11月確認・販売店の掲載</div>
      <div class="brand">防音Lab</div>
    </footer>
  </main>
</body>
</html>
