<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="memo-common.css"></head><body>
<div class="wrap">
  <span class="kicker">保存版メモ</span>
  <h1>ファミリー向け防音賃貸<br><em>内見チェックメモ</em></h1>
  <p class="lead">間取り図と一緒に、内見でスクショを見返す1枚</p>

  <div class="card">
    <h2>音の通り道 4項目</h2>
    <ul class="check">
      <li><span class="cb"></span><span class="t">外への音<small>楽器を置く部屋から、隣家の窓や共用廊下がどちらにあるか</small></span></li>
      <li><span class="cb"></span><span class="t">別の住戸への音<small>遊ぶ部屋の下と、演奏する部屋の隣が何に面するか</small></span></li>
      <li><span class="cb"></span><span class="t">家族の中の音<small>寝室の扉を閉め、許可を得て廊下や居間からの声の聞こえ方</small></span></li>
      <li><span class="cb"></span><span class="t">使い方の条件<small>楽器の種類と演奏時間、防音室の使える部屋、窓・換気の扱い</small></span></li>
    </ul>
  </div>

  <div class="bar">練習する部屋と家族の寝室を、先に間取り図で囲んでおく</div>

  <div class="foot">
    <div>※演奏できる楽器と時間は物件の規約によって変わります。<br>　管理会社に確認してください。</div>
    <div class="brand">防音Lab</div>
  </div>
</div></body></html>
