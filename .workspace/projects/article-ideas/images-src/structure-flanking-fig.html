<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="memo-common.css">
<style>.wrap{padding:40px 0 30px}svg{display:block}svg text{font-family:"BIZ UDPGothic","Noto Sans JP","Yu Gothic","Meiryo",sans-serif}</style></head><body>
<div class="wrap">
<svg viewBox="0 0 1080 760" width="1080" height="760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d4af37"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e6a56a"/></marker>
  </defs>
  <text x="540" y="52" text-anchor="middle" font-size="38" font-weight="700" fill="#f4ecdc">隣の部屋へ音が届く2つの経路（平面図）</text>
  <!-- rooms -->
  <rect x="80" y="110" width="430" height="400" rx="10" fill="#241c15" stroke="#4a3b2a" stroke-width="3"/>
  <rect x="570" y="110" width="430" height="400" rx="10" fill="#241c15" stroke="#4a3b2a" stroke-width="3"/>
  <text x="295" y="170" text-anchor="middle" font-size="32" font-weight="700" fill="#e8d070">音を出す部屋</text>
  <text x="785" y="170" text-anchor="middle" font-size="32" font-weight="700" fill="#e8d070">隣の部屋</text>
  <!-- partition wall -->
  <rect x="510" y="110" width="60" height="400" fill="#7a6a55"/>
  <text x="540" y="100" text-anchor="middle" font-size="28" fill="#f4ecdc">戸境壁</text>
  <!-- exterior wall -->
  <rect x="60" y="510" width="960" height="44" fill="#5c4c3a"/>
  <text x="230" y="541" text-anchor="middle" font-size="27" fill="#f4ecdc">外壁側（外壁・窓）</text>
  <!-- source -->
  <circle cx="230" cy="290" r="26" fill="#d4af37"/>
  <text x="230" y="350" text-anchor="middle" font-size="27" fill="#c9bda6">音源</text>
  <!-- path 1: straight through partition -->
  <line x1="262" y1="290" x2="730" y2="290" stroke="#d4af37" stroke-width="8" marker-end="url(#ag)"/>
  <text x="785" y="240" text-anchor="middle" font-size="29" font-weight="700" fill="#d4af37">① 壁を通る音</text>
  <!-- path 2: flanking via exterior wall -->
  <path d="M245,318 L420,490 L540,532 L660,490 L760,410" fill="none" stroke="#e6a56a" stroke-width="8" stroke-dasharray="18 10" marker-end="url(#aw)"/>
  <text x="800" y="380" text-anchor="start" font-size="29" font-weight="700" fill="#e6a56a">② 外壁側を</text>
  <text x="800" y="418" text-anchor="start" font-size="29" font-weight="700" fill="#e6a56a">回る音</text>
  <!-- legend -->
  <text x="80" y="620" font-size="27" fill="#f4ecdc">① は戸境壁の仕様で決まる経路</text>
  <text x="80" y="664" font-size="27" fill="#f4ecdc">② は戸境壁と外壁がつながる箇所の納まりで変わる経路</text>
  <text x="80" y="708" font-size="24" fill="#c9bda6">（側路伝搬音。出典は本文の日本建設業連合会の事例集）</text>
  <text x="1000" y="708" text-anchor="end" font-size="28" font-weight="700" fill="#e8d070">防音Lab</text>
</svg>
</div></body></html>
