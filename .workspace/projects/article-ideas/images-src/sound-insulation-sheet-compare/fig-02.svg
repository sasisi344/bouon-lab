    <rect x="56" y="184" width="968" height="385" rx="26" class="panel"/>
    <text x="83" y="244" >サンダム CZ-12</text>
    <rect x="384" y="222" width="450" height="26" rx="6" class="track"/>
    <rect x="384" y="222" width="213.8" height="26" rx="6" class="gold"/>
    <text x="994" y="244" text-anchor="end">約+1.9dB</text>
    <text x="83" y="317" >大建 940SS</text>
    <rect x="384" y="295" width="450" height="26" rx="6" class="track"/>
    <rect x="384" y="295" width="202.5" height="26" rx="6" class="gold"/>
    <text x="994" y="317" text-anchor="end">約+1.8dB</text>
    <text x="83" y="390" >大建 940N</text>
    <rect x="384" y="368" width="450" height="26" rx="6" class="track"/>
    <rect x="384" y="368" width="315" height="26" rx="6" class="gold"/>
    <text x="994" y="390" text-anchor="end">約+2.8dB</text>
    <text x="83" y="463" >サンダム K-PROX</text>
    <rect x="384" y="441" width="450" height="26" rx="6" class="track"/>
    <rect x="384" y="441" width="360" height="26" rx="6" class="gold"/>
    <text x="994" y="463" text-anchor="end">約+3.2dB</text>
    <text x="83" y="536" >大建 455H</text>
    <rect x="384" y="514" width="450" height="26" rx="6" class="track"/>
    <rect x="384" y="514" width="393.8" height="26" rx="6" class="gold"/>
