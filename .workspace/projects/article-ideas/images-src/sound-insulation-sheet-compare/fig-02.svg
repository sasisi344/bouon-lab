<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" class="chart" viewBox="0 0 1080 694" role="img" aria-label="遮音シートの改善量（dB）">
  <style>
    .chart { display:block; width:1080px; background:#17120e; font-family:"BIZ UDPGothic","Noto Sans JP","Yu Gothic","Meiryo",sans-serif; }
    .chart text { fill:#f4ecdc; font-size:29px; }
    .chart .title { fill:#e8d070; font-size:54px; font-weight:700; }
    .chart .heading { font-size:33px; font-weight:700; }
    .chart .note { fill:#c9bda6; font-size:24px; }
    .chart .brand { fill:#e8d070; font-size:28px; font-weight:700; }
    .track { fill:#4a3b2a; }
    .gold { fill:#d4af37; }
    .green { fill:#8fc9a0; }
    .amber { fill:#e6a56a; }
    .panel { fill:#241c15; stroke:#4a3b2a; stroke-width:2; }
    .rule { stroke:#4a3b2a; stroke-width:2; }
  </style>
    <text x="56" y="103" class="title">改善量（dB）</text>
