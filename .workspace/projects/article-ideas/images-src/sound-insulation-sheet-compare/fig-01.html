<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>遮音シートの比較</title>
  <link rel="stylesheet" href="../memo-common.css">
  <style>
    .foot { font-size:24px; gap:24px; }
    .card { margin-top:28px; padding:18px 30px; }
    table { width:100%; border-collapse:collapse; font-size:29px; font-variant-numeric:tabular-nums; }
    th, td { padding:20px 10px; white-space:nowrap; }
    thead th { color:var(--gold-soft); }
    tbody tr { border-top:2px solid var(--line); }
    tbody th { text-align:left; }
    thead th:first-child { text-align:left; }
    td, thead th { text-align:right; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1><em>遮音シート</em>の比較</h1>
    <div class="card">
      <table>
        <thead><tr><th scope="col">品番</th><th scope="col">厚さ</th><th scope="col">面密度</th><th scope="col">1巻の重さ</th></tr></thead>
        <tbody>
          <tr><th scope="row">大建 455H</th><td>2.8mm</td><td>4.2kg/m²</td><td>11.5kg</td></tr>
          <tr><th scope="row">大建 940SS</th><td>1.2mm</td><td>2.0kg/m²</td><td>19kg</td></tr>
          <tr><th scope="row">大建 940N</th><td>2.8mm</td><td>3.2kg/m²</td><td>30kg</td></tr>
          <tr><th scope="row">サンダム CZ-12</th><td>1.2mm</td><td>2.1kg/m²</td><td>記載なし</td></tr>
          <tr><th scope="row">サンダム K-PROX</th><td>1.6mm</td><td>3.8kg/m²</td><td>記載なし</td></tr>
        </tbody>
      </table>
    </div>
    <footer class="foot"><span>メーカーのページの値</span><span class="brand">防音Lab</span></footer>
  </main>
</body>
</html>
