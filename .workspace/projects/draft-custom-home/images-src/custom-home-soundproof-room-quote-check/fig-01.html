<html lang="ja">
<head><meta charset="utf-8"><title>防音室の見積もり比較</title><link rel="stylesheet" href="../../../../../.claude/skills/bouon-memo-image/templates/memo-common.css"><style>svg{display:block;width:968px;height:auto}.room,.focus,.street,.plot{fill:var(--card);stroke:var(--line);stroke-width:3}.focus{fill:var(--card2);stroke:var(--gold)}.street{fill:#302b26;stroke:#71614d}.plot{fill:none;stroke:#71614d;stroke-dasharray:10 8}svg text{fill:var(--text);font-size:30px;text-anchor:middle;font-weight:700}.small{font-size:26px;font-weight:400;fill:var(--dim)}.gold{font-size:28px;fill:var(--gold-soft)}.mint{font-size:28px;fill:var(--ok)}.arrow,.arrow-green,.leader,.road-mark,.window{fill:none;stroke:var(--gold-soft);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.arrow{marker-end:url(#arrow-gold)}.arrow-green{stroke:var(--ok);marker-end:url(#arrow-mint)}.leader{stroke:var(--dim);stroke-width:2}.road-mark{stroke:var(--dim);stroke-width:2;stroke-dasharray:10 10}.window{stroke:var(--ok);stroke-width:7}.vent{fill:var(--ok)}.diagram{background:var(--card);border:2px solid var(--line);border-radius:24px}.diagram svg{width:100%}.tag{width:218px}.foot{font-size:24px}</style></head>
<body><main class="wrap"><h1>防音室の見積もり比較</h1><p class="lead">同じ平面図で夜にピアノを弾く想定の記入例です。</p>
<div class="card"><h2>A社</h2><div class="row"><span class="tag">別途工事</span><span class="val">住宅会社が下地を施工。換気の電源は別途</span></div><div class="row"><span class="tag">完成時の測定</span><span class="val">現地測定あり。報告書は未確認</span></div></div><div class="card"><h2>B社</h2><div class="row"><span class="tag">別途工事</span><span class="val">床下地を一部計上。換気の電源は未確認</span></div><div class="row"><span class="tag">完成時の測定</span><span class="val">測定は別途。引き渡し時に現地確認</span></div></div><div class="card"><h2>追加で聞くこと</h2><div class="row"><span class="tag">工事範囲</span><span class="val">下地と電源をどの会社が担当するか</span></div><div class="row"><span class="tag">測定条件</span><span class="val">どこで測り、どの条件で判定するか</span></div><div class="row"><span class="tag">引き渡し</span><span class="val">報告書の有無と未達時の連絡・再測定</span></div></div>
<footer class="foot"><div>見積もりの内訳は仮例です。</div><div class="brand">防音Lab</div></footer></main></body></html>
