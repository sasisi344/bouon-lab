<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>ピアノ室の1階案と2階案</title><link rel="stylesheet" href="../../../../../.claude/skills/bouon-memo-image/templates/memo-common.css"><style>svg{display:block;width:968px;height:auto}.room,.focus,.street,.plot{fill:var(--card);stroke:var(--line);stroke-width:3}.focus{fill:var(--card2);stroke:var(--gold)}.street{fill:#302b26;stroke:#71614d}.plot{fill:none;stroke:#71614d;stroke-dasharray:10 8}svg text{fill:var(--text);font-size:30px;text-anchor:middle;font-weight:700}.small{font-size:26px;font-weight:400;fill:var(--dim)}.gold{font-size:28px;fill:var(--gold-soft)}.mint{font-size:28px;fill:var(--ok)}.arrow,.arrow-green,.leader,.road-mark,.window{fill:none;stroke:var(--gold-soft);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.arrow{marker-end:url(#arrow-gold)}.arrow-green{stroke:var(--ok);marker-end:url(#arrow-mint)}.leader{stroke:var(--dim);stroke-width:2}.road-mark{stroke:var(--dim);stroke-width:2;stroke-dasharray:10 10}.window{stroke:var(--ok);stroke-width:7}.vent{fill:var(--ok)}.diagram{background:var(--card);border:2px solid var(--line);border-radius:24px}.diagram svg{width:100%}.tag{width:218px}.foot{font-size:24px}</style></head>
<body><main class="wrap"><h1>ピアノ室の1階案と2階案</h1><p class="lead">同じピアノを置くときの搬入経路、床、演奏音を比べます。</p>
<div class="card"><h2>1階案</h2><div class="row"><span class="tag">搬入経路</span><span class="val">玄関から廊下の曲がり角を通る</span></div><div class="row"><span class="tag">床と脚の位置</span><span class="val">設置位置の脚と床下地を設計者に確認</span></div><div class="row"><span class="tag">演奏音の確認</span><span class="val">真上の寝室と外壁側の窓</span></div></div><div class="card"><h2>2階案</h2><div class="row"><span class="tag">搬入経路</span><span class="val">階段と踊り場を通れるか搬入業者に確認</span></div><div class="row"><span class="tag">床と脚の位置</span><span class="val">脚の位置と床・梁、直下の部屋を確認</span></div><div class="row"><span class="tag">演奏音の確認</span><span class="val">同じ階の寝室と隣家側の窓</span></div></div>
<footer class="foot"><div>候補位置と室内の経路は仮例です。</div><div class="brand">防音Lab</div></footer></main></body></html>
