<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../memo-common.css"></head><body>
<div class="wrap">
  <span class="kicker">図解</span>
  <h1>マイクを囲う<br><em>開放型シールド</em>の置き方</h1>
  <p class="lead">囲うのはマイクの後ろと左右だけ。上と手前は開けて、顔は外に出す。</p>
  <div class="fig"><svg viewBox="0 0 968 600" xmlns="http://www.w3.org/2000/svg">
<!-- 上から見た図 -->
<text x="484" y="40" text-anchor="middle" class="s">上から見た図</text>
<!-- 机 -->
<rect x="140" y="70" width="688" height="380" fill="#2e241b" stroke="#4a3b2a" stroke-width="2" rx="14"/>
<text x="160" y="105" class="s">机</text>
<!-- U字シールド: 後ろ(上側)と左右 -->
<path d="M300 330 L300 140 L668 140 L668 330" fill="none" stroke="#c9bda6" stroke-width="10" stroke-linejoin="round"/>
<!-- 吸音材 内側 -->
<path d="M318 330 L318 158 L650 158 L650 330" fill="none" stroke="#d4af37" stroke-width="14" stroke-linejoin="round" stroke-dasharray="2 0"/>
<text x="484" y="128" text-anchor="middle" class="m b">段ボール（後ろ）</text>
<text x="700" y="250" class="m">段ボール（横）</text>
<text x="484" y="200" text-anchor="middle" class="m b g">内側に吸音材</text>
<!-- マイク -->
<circle cx="484" cy="270" r="30" fill="#e8d070"/>
<text x="484" y="320" text-anchor="middle" class="m b">マイク</text>
<!-- 開放面 -->
<line x1="300" y1="365" x2="668" y2="365" stroke="#8fc9a0" stroke-width="4" stroke-dasharray="12 10"/>
<text x="484" y="400" text-anchor="middle" class="m b o">手前は開ける</text>
<!-- 顔の位置 -->
<circle cx="484" cy="520" r="44" fill="none" stroke="#c9bda6" stroke-width="4"/>
<text x="484" y="529" text-anchor="middle" class="m">顔</text>
<text x="560" y="515" class="m">囲いの外から話す</text>
<!-- 上は開放 -->
<text x="160" y="420" class="s">上面もふさがない</text>
  </svg></div>
  <div class="bar">頭を入れる箱にしない。口や鼻を材料でふさがない。</div>
  <div class="foot">
    <div>※反響を減らす工作例で、声漏れを防ぐ設計図ではありません。<br>手順は本文参照。</div>
    <div class="brand">防音Lab</div>
  </div>
</div></body></html>
