<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../memo-common.css"></head><body>
<div class="wrap">
  <span class="kicker">図解</span>
  <h1>防音ブースの椅子は<br><em>動く範囲</em>まで測る</h1>
  <p class="lead">置けるかではなく、座って足を動かし、立って出られるかを見る。</p>
  <div class="fig"><svg viewBox="0 0 968 1010" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d4af37"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fc9a0"/></marker>
</defs>
<!-- ===== 上: 上から見た図 ===== -->
<text x="40" y="34" class="m b">上から見た図</text>
<rect x="80" y="60" width="340" height="440" fill="#2e241b" stroke="#c9bda6" stroke-width="6"/>
<!-- 机 -->
<rect x="96" y="74" width="308" height="70" fill="#4a3b2a" stroke="#c9bda6" stroke-width="2" rx="4"/>
<text x="250" y="118" text-anchor="middle" class="m b">机</text>
<!-- 足元 -->
<rect x="200" y="148" width="100" height="56" fill="none" stroke="#8fc9a0" stroke-width="3" stroke-dasharray="8 6"/>
<!-- 最大幅 -->
<line x1="178" y1="222" x2="322" y2="222" stroke="#d4af37" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>
<!-- 椅子 -->
<rect x="190" y="236" width="120" height="96" fill="#e8d070" rx="10"/>
<rect x="190" y="332" width="120" height="20" fill="#c9a94a" rx="6"/>
<text x="250" y="292" text-anchor="middle" class="m b" style="fill:#17120e">椅子</text>
<!-- 引く範囲 -->
<rect x="190" y="356" width="120" height="62" fill="none" stroke="#d4af37" stroke-width="3" stroke-dasharray="6 6"/>
<!-- 扉 -->
<line x1="100" y1="500" x2="210" y2="500" stroke="#17120e" stroke-width="10"/>
<path d="M100 500 A110 110 0 0 1 210 390" fill="none" stroke="#8a7f6c" stroke-width="2" stroke-dasharray="4 5"/>
<text x="155" y="536" text-anchor="middle" class="s">扉</text>
<!-- 通路 -->
<path d="M330 380 C 340 450, 230 460, 175 478" fill="none" stroke="#8fc9a0" stroke-width="4" marker-end="url(#ag)"/>
<!-- ラベル（右の列） -->
<g stroke="#8a7f6c" stroke-width="1.5">
  <line x1="420" y1="90" x2="470" y2="90"/>
  <line x1="300" y1="176" x2="470" y2="176"/>
  <line x1="322" y1="222" x2="470" y2="240"/>
  <line x1="310" y1="387" x2="470" y2="330"/>
  <line x1="336" y1="420" x2="470" y2="420"/>
</g>
<text x="480" y="98" class="m b">ブースの内寸（壁の内側）</text>
<text x="480" y="184" class="m b o">足を前へ動かす場所</text>
<text x="480" y="248" class="m b g">椅子の最大幅</text>
<text x="480" y="282" class="s">肘掛け・キャスターの脚を含む</text>
<text x="480" y="338" class="m b g">椅子を引く範囲</text>
<text x="480" y="428" class="m b o">扉までの通路</text>
<text x="480" y="462" class="s">立ち上がって出られるか</text>
<!-- 区切り -->
<line x1="40" y1="580" x2="928" y2="580" stroke="#4a3b2a" stroke-width="2"/>
<!-- ===== 下: 横から見た図 ===== -->
<text x="40" y="630" class="m b">横から見た図</text>
<line x1="60" y1="940" x2="560" y2="940" stroke="#c9bda6" stroke-width="4"/>
<text x="70" y="975" class="s">床</text>
<!-- 机 -->
<rect x="80" y="690" width="230" height="18" fill="#4a3b2a" stroke="#c9bda6" stroke-width="2"/>
<line x1="96" y1="708" x2="96" y2="940" stroke="#c9bda6" stroke-width="6"/>
<text x="150" y="680" class="m b">机</text>
<!-- 机の下面の高さ -->
<line x1="130" y1="714" x2="130" y2="934" stroke="#d4af37" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>
<!-- 膝・足 -->
<path d="M380 780 L300 780 L285 935" fill="none" stroke="#8fc9a0" stroke-width="4" stroke-dasharray="10 7"/>
<!-- 椅子 -->
<rect x="380" y="776" width="110" height="18" fill="#e8d070" rx="4"/>
<rect x="472" y="640" width="18" height="136" fill="#e8d070" rx="4"/>
<line x1="435" y1="794" x2="435" y2="912" stroke="#e8d070" stroke-width="8"/>
<line x1="390" y1="922" x2="480" y2="922" stroke="#e8d070" stroke-width="6"/>
<circle cx="392" cy="932" r="7" fill="#e8d070"/><circle cx="478" cy="932" r="7" fill="#e8d070"/>
<!-- 座面の高さ -->
<line x1="525" y1="782" x2="525" y2="934" stroke="#d4af37" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>
<!-- ラベル -->
<g stroke="#8a7f6c" stroke-width="1.5">
  <line x1="130" y1="840" x2="200" y2="860"/>
  <line x1="287" y1="925" x2="287" y2="950"/>
  <line x1="525" y1="860" x2="600" y2="860"/>
</g>
<text x="150" y="895" class="m b g">机の下面</text>
<text x="230" y="980" class="m b o">膝・つま先の位置</text>
<text x="610" y="850" class="m b g">座面の高さ</text>
<text x="610" y="884" class="s">足が床に届き、</text>
<text x="610" y="916" class="s">机の下に膝が入るか</text>
  </svg></div>
  <div class="bar">椅子は一番外側の寸法で比べ、<br>回す・倒す・引く動きでも収まるかを試す</div>
  <div class="foot">
    <div>※寸法の目安は載せていません。測る場所の図です。<br>手順は本文参照。</div>
    <div class="brand">防音Lab</div>
  </div>
</div></body></html>
