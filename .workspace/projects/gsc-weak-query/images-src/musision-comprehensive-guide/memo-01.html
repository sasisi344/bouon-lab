<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../memo-common.css"><link rel="stylesheet" href="../flow.css"></head><body>
<div class="wrap">
  <span class="kicker">保存版メモ</span>
  <h1>ミュージションは<br><em>家賃だけで決めない</em></h1>
  <p class="lead">申込みの前に、上から順に確かめる1枚。</p>
  <div class="card"><h2><span class="num">1</span>月額総額を出す</h2>
    <div class="row"><span class="tag">足すもの</span><span class="val">賃料・管理費・月額保証料・駐輪場代など</span></div>
    <div class="row"><span class="tag">比べる相手</span><span class="val">今の住まい＋スタジオ代＋交通費</span></div>
  </div>
  <div class="arrow">▼</div>
  <div class="card"><h2><span class="num">2</span>審査の必要書類を聞く</h2>
    <div class="row"><span class="tag">審査</span><span class="val">オーナーと保証会社が行う</span></div>
    <div class="row"><span class="tag">確認</span><span class="val">働き方に合う書類、保証人等の条件、回答までの日程</span></div>
  </div>
  <div class="arrow">▼</div>
  <div class="card"><h2><span class="num">3</span>楽器と演奏条件を確かめる</h2>
    <div class="row"><span class="tag">遮音性能</span><span class="val">契約する号室と隣戸の間の値</span></div>
    <div class="row"><span class="tag">内見</span><span class="val">自分の楽器で試奏できるか、時間・音量の条件</span></div>
  </div>
  <div class="bar">最高D-85は、どの号室にも当てはまる値ではない</div>
  <div class="foot">
    <div>※公式サイトの案内（2026年11月8日確認）による整理。<br>出典は本文参照。</div>
    <div class="brand">防音Lab</div>
  </div>
</div></body></html>
