<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="memo-common.css">
<style>
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.chip{font-size:28px;background:var(--card2);border:2px solid var(--gold);border-radius:999px;padding:6px 22px}
.arrow{text-align:center;font-size:40px;color:var(--gold);line-height:1;margin:-8px 0 10px}
.two{display:flex;gap:18px;margin-top:6px}
.box{flex:1;background:var(--card2);border:2px solid var(--line);border-radius:18px;padding:18px 22px;font-size:27px;line-height:1.5}
.box b{display:block;font-size:30px;color:var(--gold-soft);margin-bottom:6px}
.sub{font-size:27px;line-height:1.55;margin-top:10px}
.okc{color:var(--ok);font-weight:700}
</style></head><body>
<!-- 型: flow（判断フロー）。上から順に確認して絞り込む。ステップは3〜4つまで -->
<div class="wrap">
  <span class="kicker">保存版メモ</span>
  <h1>［テーマ］<em>判断フロー</em><br>［数］ステップ</h1>
  <p class="lead">上から順に確認すれば、<br>［何が絞れるか］。</p>

  <div class="card">
    <h2><span class="num">1</span>［問い1］</h2>
    <div class="chips"><span class="chip">［選択肢］</span><span class="chip">［選択肢］</span></div>
    <p class="note">［補足1行］</p>
  </div>
  <div class="arrow">▼</div>

  <div class="card">
    <h2><span class="num">2</span>［問い2］</h2>
    <p class="sub"><span class="okc">［Yesなら］→ ここで解決。</span>［Noなら］→ ステップ3へ</p>
  </div>
  <div class="arrow">▼</div>

  <div class="card">
    <h2><span class="num">3</span>［問い3］</h2>
    <div class="two">
      <div class="box"><b>［分岐A］</b>［1〜2行］</div>
      <div class="box"><b>［分岐B］</b>［1〜2行］</div>
    </div>
  </div>

  <div class="foot">
    <div>※［目安の整理である旨］</div>
    <div class="brand">防音Lab</div>
  </div>
</div></body></html>
