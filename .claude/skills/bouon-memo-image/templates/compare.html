<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="memo-common.css"></head><body>
<!-- 型: compare（比較メモ）。選択肢2〜4つを、向く人・注意点で見比べる。カードを増減して使う -->
<div class="wrap">
  <span class="kicker">保存版メモ</span>
  <h1>［テーマ］は<em>［数］つ</em><br>比較メモ</h1>
  <p class="lead">［この1枚で何が分かるか。1〜2行］</p>

  <div class="card">
    <h2><span class="num">1</span>［選択肢A］</h2>
    <div class="row"><span class="tag">向く人</span><span class="val">［誰に向くか］</span></div>
    <div class="row"><span class="tag warn">注意</span><span class="val">［注意点］</span></div>
  </div>

  <div class="card">
    <h2><span class="num">2</span>［選択肢B］</h2>
    <div class="row"><span class="tag">向く人</span><span class="val">［誰に向くか］</span></div>
    <div class="row"><span class="tag ok">目安</span><span class="val">［期間・種類など確認済みの事実］</span></div>
    <div class="row"><span class="tag warn">注意</span><span class="val">［注意点］</span></div>
  </div>

  <div class="foot">
    <div>※［出典・目安である旨を1〜2行］</div>
    <div class="brand">防音Lab</div>
  </div>
</div></body></html>
