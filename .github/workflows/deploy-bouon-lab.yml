name: Deploy Bouon Lab

on:
  push:
    branches:
      - main
    paths:
      - "**"
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

defaults:
  run:
    working-directory: .

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛡️ Fix Dubious Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 💾 Setup Astro Build Cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.astro
            node_modules/.cache
          key: ${{ runner.os }}-astro-build-bouon-${{ hashFiles('package-lock.json') }}-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-astro-build-bouon-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-astro-build-bouon-

      - name: 🔨 Build Astro Project
        run: npm run build

      - name: 🚀 Deploy via FTP (Diff only)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.BOUON_FTP_SERVER || secrets.FTP_SERVER }}
          username: ${{ secrets.BOUON_FTP_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.BOUON_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: /bouon-lab.com/public_html/
          # en 停止後に dist から消えたパスを旧 state が「削除対象」と誤認し 550 になるのを防ぐ（2026-06-01）
          state-name: .ftp-deploy-sync-state-bouon-v2.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
